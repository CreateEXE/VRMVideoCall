<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual AI Camera - VRM</title>
  <script type="module" crossorigin src="/assets/index-CYN9ruFQ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-C8hwYXNX.css">
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="status-bar">
            <span class="live-indicator">● LIVE</span>
            
            <div class="camera-controls">
                <label for="camera-mode">Camera Mode: </label>
                <select id="camera-mode">
                    <option value="HANDHELD">HANDHELD</option>
                    <option value="SELFIE" selected>SELFIE</option>
                    <option value="FULL_BODY">FULL BODY</option>
                    <option value="LOCKED">LOCKED</option>
                    <option value="TRIPOD">TRIPOD</option>
                    <option value="FOLLOW">FOLLOW</option>
                    <option value="FREE">FREE</option>
                </select>
            </div>

            <span class="viewers">1 Viewer (You)</span>
        </div>
        
        <div class="chat-box">
            <div id="chat-feed"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type tip command (e.g. /dance, /wave)...">
                <button id="send-btn">Send</button>
            </div>
        </div>
        
        <div class="controls">
            <button id="mute-btn">🎤 Mute</button>
            <button id="settings-btn">⚙️</button>
        </div>
    </div>

    
</body>
</html>
